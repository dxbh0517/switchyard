name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Stdlib tests run with `python3 -m unittest discover -s tests`.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Config, compose snippet, or commands that trigger it.
      render: markdown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Switchyard version / commit
      placeholder: "0.1.0 or git SHA"
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Docker or bare metal, vLLM / ComfyUI / OVMS versions if relevant.
      render: markdown
