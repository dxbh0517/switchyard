name: CI

# PRs only (pushes to main were re-running what the PR already tested).
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Run every Python version to completion so one failure doesn't hide another.
      fail-fast: false
      matrix:
        # Oldest and newest supported; 3.11 sits between them.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Install tray extra
        # Wheels install headless. pystray may not *import* without Gtk; tests skip that.
        run: python -m pip install -e ".[tray]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
